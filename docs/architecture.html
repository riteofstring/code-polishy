        <title id="diagram-title">Code Polishy architecture</title>
        <desc id="diagram-description">
          Agents, developers, and CI invoke repository wrappers. The repository
          lock selects an installed release; its release-local launcher verifies
          the manifest and starts the Go CLI and policy engine. The engine
          combines repository facts with the shared policy baseline and selects
          quality, architecture, testing, supply-chain, artifact-security, and
          optional behavior-review checks. Shared execution and evidence
          services run pinned tools and declared commands in child processes.
          The engine collects structured findings and the CLI produces reports
          and an exit status. Setup and upgrade acquire checksum-verified
          release archives separately from ordinary checks. Arrows show
          execution and information flow, not every Go import dependency.
        </desc>
