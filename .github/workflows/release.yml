name: Publish native release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated version tag to publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: native-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  identify:
    name: Identify release
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.release.outputs.commit }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Verify annotated release tag
        id: release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "${REQUESTED_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "Release tags must use strict vMAJOR.MINOR.PATCH SemVer." >&2
            exit 1
          fi
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          authorization="$(printf 'x-access-token:%s' "${GITHUB_TOKEN}" | base64 | tr -d '\r\n')"
          printf '::add-mask::%s\n' "${authorization}"
          git -c "http.extraheader=AUTHORIZATION: basic ${authorization}" \
            fetch --depth=1 origin "refs/tags/${REQUESTED_TAG}:refs/tags/${REQUESTED_TAG}"
          unset authorization
          if [[ "$(git cat-file -t "refs/tags/${REQUESTED_TAG}")" != tag ]]; then
            echo "${REQUESTED_TAG} is not an annotated tag." >&2
            exit 1
          fi
          release_commit="$(git for-each-ref --format='%(object)' "refs/tags/${REQUESTED_TAG}")"
          if [[ ! "${release_commit}" =~ ^[0-9a-f]{40}$ ]] ||
            [[ "$(git cat-file -t "${release_commit}")" != commit ]]; then
            echo "${REQUESTED_TAG} does not point directly at one commit." >&2
            exit 1
          fi
          git checkout --detach "${release_commit}"
          ./scripts/release-preflight.sh "${release_commit}"
          release_version="$(./scripts/release-version.sh VERSION)"
          if [[ "${REQUESTED_TAG}" != "v${release_version}" ]]; then
            echo "${REQUESTED_TAG} does not match VERSION ${release_version}." >&2
            exit 1
          fi
          printf 'commit=%s\n' "${release_commit}" >>"${GITHUB_OUTPUT}"
          printf 'tag=%s\n' "${REQUESTED_TAG}" >>"${GITHUB_OUTPUT}"
          printf 'version=%s\n' "${release_version}" >>"${GITHUB_OUTPUT}"

  build:
    name: Build ${{ matrix.host }}
    needs: identify
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: darwin-arm64
            runner: macos-15
            system: Darwin
            architecture: arm64
            build: posix
          - host: darwin-x64
            runner: macos-15-intel
            system: Darwin
            architecture: x86_64
            build: posix
          - host: linux-arm64
            runner: ubuntu-24.04-arm
            system: Linux
            architecture: aarch64
            build: posix
          - host: linux-x64
            runner: ubuntu-24.04
            system: Linux
            architecture: x86_64
            build: posix
          - host: windows-x64
            runner: windows-2025
            system: Windows
            architecture: AMD64
            build: windows
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out exact release tag
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.identify.outputs.commit }}
          RELEASE_TAG: ${{ needs.identify.outputs.tag }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          authorization="$(printf 'x-access-token:%s' "${GITHUB_TOKEN}" | base64 | tr -d '\r\n')"
          printf '::add-mask::%s\n' "${authorization}"
          git -c "http.extraheader=AUTHORIZATION: basic ${authorization}" \
            fetch --depth=1 origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          unset authorization
          resolved_commit="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          if [[ "${resolved_commit}" != "${RELEASE_COMMIT}" ]]; then
            echo "${RELEASE_TAG} no longer resolves to ${RELEASE_COMMIT}." >&2
            exit 1
          fi
          git checkout --detach "${RELEASE_COMMIT}"

      - name: Build and smoke-test native archive
        if: matrix.build == 'posix'
        shell: bash
        env:
          EXPECTED_ARCHITECTURE: ${{ matrix.architecture }}
          EXPECTED_SYSTEM: ${{ matrix.system }}
          RELEASE_HOST: ${{ matrix.host }}
          RELEASE_VERSION: ${{ needs.identify.outputs.version }}
        run: |
          set -euo pipefail
          if [[ "$(uname -s)" != "${EXPECTED_SYSTEM}" ]] ||
            [[ "$(uname -m)" != "${EXPECTED_ARCHITECTURE}" ]]; then
            echo "The runner is not the requested ${RELEASE_HOST} native host." >&2
            exit 1
          fi
          ./tools/install-policy-tools.sh
          publication_dir="${RUNNER_TEMP}/publication/${RELEASE_HOST}"
          ./scripts/build-release.sh --output "${publication_dir}"
          archive="${publication_dir}/code-polishy-${RELEASE_VERSION}-${RELEASE_HOST}.zip"
          descriptor="${publication_dir}/code-polishy-${RELEASE_VERSION}-${RELEASE_HOST}.release.json"
          test -f "${archive}"
          test -f "${descriptor}"
          archive_sha="$(
            python3 - "${descriptor}" "$(basename "${archive}")" <<'PY'
          import json
          import re
          import sys

          with open(sys.argv[1], encoding="utf-8") as source:
              descriptor = json.load(source)
          archive = descriptor.get("archive", {})
          if archive.get("name") != sys.argv[2] or not re.fullmatch(r"[0-9a-f]{64}", archive.get("sha256", "")):
              raise SystemExit("The release descriptor has invalid archive metadata.")
          print(archive["sha256"])
          PY
          )"
          if [[ ! "${archive_sha}" =~ ^[0-9a-f]{64}$ ]]; then
            echo "The release descriptor has no exact archive SHA-256." >&2
            exit 1
          fi
          inspection="${RUNNER_TEMP}/release-inspection"
          installation="${RUNNER_TEMP}/release-installation"
          mkdir -p "${inspection}"
          unzip -q "${archive}" -d "${inspection}"
          engine="${inspection}/bin/code-polishy"
          "${engine}" --policy-root "${inspection}" release-manifest verify --root "${inspection}"
          "${engine}" --policy-root "${inspection}" install-bundle \
            --source "${archive}" --sha256 "${archive_sha}" --prefix "${installation}"
          installed_engine="$(find "${installation}/releases" -path '*/bin/code-polishy' -type f -print)"
          installed_engine_count="$(find "${installation}/releases" -path '*/bin/code-polishy' -type f | wc -l | tr -d '[:space:]')"
          if [[ "${installed_engine_count}" -ne 1 ]]; then
            echo "The fresh installation did not contain exactly one release engine." >&2
            exit 1
          fi
          installed_root="$(cd "$(dirname "${installed_engine}")/.." && pwd -P)"
          if [[ "$("${installed_engine}" --policy-root "${installed_root}" version)" != "code-polishy ${RELEASE_VERSION}" ]]; then
            echo "The fresh installation did not report Code Polishy ${RELEASE_VERSION}." >&2
            exit 1
          fi

      - name: Build and smoke-test native archive
        if: matrix.build == 'windows'
        shell: pwsh
        env:
          EXPECTED_ARCHITECTURE: ${{ matrix.architecture }}
          RELEASE_HOST: ${{ matrix.host }}
          RELEASE_VERSION: ${{ needs.identify.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          if ($env:RUNNER_OS -ne 'Windows' -or $env:PROCESSOR_ARCHITECTURE -ne $env:EXPECTED_ARCHITECTURE) {
            throw "The runner is not the requested $env:RELEASE_HOST native host."
          }
          .\tools\install-policy-tools.ps1
          $publicationDir = Join-Path $env:RUNNER_TEMP "publication\$env:RELEASE_HOST"
          $rawArchive = Join-Path $env:RUNNER_TEMP 'code-polishy-release.zip'
          .\scripts\build-release.ps1 -Output $rawArchive -PublicationDirectory $publicationDir
          $archive = Join-Path $publicationDir "code-polishy-$env:RELEASE_VERSION-$env:RELEASE_HOST.zip"
          $descriptor = Join-Path $publicationDir "code-polishy-$env:RELEASE_VERSION-$env:RELEASE_HOST.release.json"
          foreach ($releaseFile in @($archive, $descriptor)) {
            if (-not (Test-Path -LiteralPath $releaseFile -PathType Leaf)) {
              throw "The release output is missing $releaseFile."
            }
          }
          $releaseDescriptor = Get-Content -LiteralPath $descriptor -Raw | ConvertFrom-Json
          $archiveSha = [string]$releaseDescriptor.archive.sha256
          if ([string]$releaseDescriptor.archive.name -cne [System.IO.Path]::GetFileName($archive) -or $archiveSha -cnotmatch '^[0-9a-f]{64}$') {
            throw 'The release descriptor has invalid archive metadata.'
          }
          $inspection = Join-Path $env:RUNNER_TEMP 'release-inspection'
          $installation = Join-Path $env:RUNNER_TEMP 'release-installation'
          Expand-Archive -LiteralPath $archive -DestinationPath $inspection
          $engine = Join-Path $inspection 'bin\code-polishy.exe'
          & $engine --policy-root $inspection release-manifest verify --root $inspection
          if ($LASTEXITCODE -ne 0) { throw 'The extracted release manifest was invalid.' }
          & $engine --policy-root $inspection install-bundle --source $archive --sha256 $archiveSha --prefix $installation
          if ($LASTEXITCODE -ne 0) { throw 'The fresh release installation failed.' }
          $installedEngines = @(Get-ChildItem -LiteralPath (Join-Path $installation 'releases') -Filter 'code-polishy.exe' -File -Recurse)
          if ($installedEngines.Count -ne 1) {
            throw 'The fresh installation did not contain exactly one release engine.'
          }
          $installedRoot = Split-Path -Parent (Split-Path -Parent $installedEngines[0].FullName)
          $reportedVersion = (& $installedEngines[0].FullName --policy-root $installedRoot version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $reportedVersion -ne "code-polishy $env:RELEASE_VERSION") {
            throw "The fresh installation did not report Code Polishy $env:RELEASE_VERSION."
          }

      - name: Retain native publication
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-release-${{ matrix.host }}
          path: ${{ runner.temp }}/publication/${{ matrix.host }}/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  publish:
    name: Publish GitHub release
    needs: [identify, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Restore native publications
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: native-release-*
          path: ${{ runner.temp }}/release
          merge-multiple: true

      - name: Build publication index and publish release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.identify.outputs.commit }}
          RELEASE_TAG: ${{ needs.identify.outputs.tag }}
          RELEASE_VERSION: ${{ needs.identify.outputs.version }}
        run: |
          set -euo pipefail
          release_root="${RUNNER_TEMP}/release"
          engine_root="${RUNNER_TEMP}/index-engine"
          linux_archive="${release_root}/code-polishy-${RELEASE_VERSION}-linux-x64.zip"
          mkdir -p "${engine_root}"
          unzip -q "${linux_archive}" -d "${engine_root}"
          engine="${engine_root}/bin/code-polishy"
          index_path="${release_root}/code-polishy-release-index.json"
          "${engine}" --policy-root "${engine_root}" release-manifest index \
            --artifact-descriptor "${release_root}/code-polishy-${RELEASE_VERSION}-darwin-arm64.release.json" \
            --artifact-descriptor "${release_root}/code-polishy-${RELEASE_VERSION}-darwin-x64.release.json" \
            --artifact-descriptor "${release_root}/code-polishy-${RELEASE_VERSION}-linux-arm64.release.json" \
            --artifact-descriptor "${release_root}/code-polishy-${RELEASE_VERSION}-linux-x64.release.json" \
            --artifact-descriptor "${release_root}/code-polishy-${RELEASE_VERSION}-windows-x64.release.json" \
            --output "${index_path}"
          index_sha="$(sha256sum "${index_path}" | cut -d ' ' -f1)"
          if [[ ! "${index_sha}" =~ ^[0-9a-f]{64}$ ]]; then
            echo "The publication index does not have an exact SHA-256." >&2
            exit 1
          fi
          printf '%s  %s\n' "${index_sha}" "$(basename "${index_path}")" >"${index_path}.sha256"
          asset_count="$(find "${release_root}" -maxdepth 1 -type f | wc -l | tr -d '[:space:]')"
          if [[ "${asset_count}" -ne 27 ]]; then
            echo "The complete publication must contain 27 assets, found ${asset_count}." >&2
            exit 1
          fi

          api_root="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}"
          response_file="${RUNNER_TEMP}/github-release-response.json"
          existing_status="$(
            curl --silent --show-error --output "${response_file}" --write-out '%{http_code}' \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GITHUB_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "${api_root}/releases/tags/${RELEASE_TAG}"
          )"
          if [[ "${existing_status}" == 200 ]]; then
            echo "A GitHub Release already exists for ${RELEASE_TAG}; published releases are immutable." >&2
            exit 1
          fi
          if [[ "${existing_status}" != 404 ]]; then
            cat "${response_file}" >&2
            exit 1
          fi

          payload_file="${RUNNER_TEMP}/github-release-payload.json"
          export RELEASE_INDEX_SHA="${index_sha}"
          python3 - "${payload_file}" <<'PY'
          import json
          import os
          import sys

          payload = {
              "tag_name": os.environ["RELEASE_TAG"],
              "target_commitish": os.environ["RELEASE_COMMIT"],
              "name": f"Code Polishy {os.environ['RELEASE_VERSION']}",
              "body": (
                  f"Native archives for Code Polishy {os.environ['RELEASE_VERSION']}.\n\n"
                  f"Source revision: {os.environ['RELEASE_COMMIT']}\n"
                  f"Publication index SHA-256: {os.environ['RELEASE_INDEX_SHA']}"
              ),
              "draft": True,
              "prerelease": "-" in os.environ["RELEASE_VERSION"],
          }
          with open(sys.argv[1], "w", encoding="utf-8") as destination:
              json.dump(payload, destination, separators=(",", ":"))
          PY

          create_status="$(
            curl --silent --show-error --output "${response_file}" --write-out '%{http_code}' \
              --request POST \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GITHUB_TOKEN}" \
              --header "Content-Type: application/json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --data-binary "@${payload_file}" \
              "${api_root}/releases"
          )"
          if [[ "${create_status}" != 201 ]]; then
            cat "${response_file}" >&2
            exit 1
          fi
          mapfile -t release_fields < <(
            python3 - "${response_file}" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as source:
              release = json.load(source)
          print(release["id"])
          print(release["upload_url"].split("{")[0])
          PY
          )
          release_id="${release_fields[0]}"
          upload_url="${release_fields[1]}"
          release_published=false
          rollback_release() {
            status="$?"
            trap - EXIT
            if [[ "${release_published}" != true ]]; then
              curl --silent --show-error --output /dev/null \
                --request DELETE \
                --header "Accept: application/vnd.github+json" \
                --header "Authorization: Bearer ${GITHUB_TOKEN}" \
                --header "X-GitHub-Api-Version: 2022-11-28" \
                "${api_root}/releases/${release_id}" || true
            fi
            exit "${status}"
          }
          trap rollback_release EXIT

          while IFS= read -r -d '' asset; do
            asset_name="$(basename "${asset}")"
            encoded_name="$(python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "${asset_name}")"
            upload_status="$(
              curl --silent --show-error --output "${response_file}" --write-out '%{http_code}' \
                --request POST \
                --header "Accept: application/vnd.github+json" \
                --header "Authorization: Bearer ${GITHUB_TOKEN}" \
                --header "Content-Type: application/octet-stream" \
                --header "X-GitHub-Api-Version: 2022-11-28" \
                --data-binary "@${asset}" \
                "${upload_url}?name=${encoded_name}"
            )"
            if [[ "${upload_status}" != 201 ]]; then
              cat "${response_file}" >&2
              exit 1
            fi
          done < <(find "${release_root}" -maxdepth 1 -type f -print0 | sort -z)

          publish_status="$(
            curl --silent --show-error --output "${response_file}" --write-out '%{http_code}' \
              --request PATCH \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GITHUB_TOKEN}" \
              --header "Content-Type: application/json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --data-binary '{"draft":false}' \
              "${api_root}/releases/${release_id}"
          )"
          if [[ "${publish_status}" != 200 ]]; then
            cat "${response_file}" >&2
            exit 1
          fi
          release_published=true
          printf 'Published %s with index SHA-256 %s.\n' "${RELEASE_TAG}" "${index_sha}"
