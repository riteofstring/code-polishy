<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title description">
  <title id="title">How Code Polishy works</title>
  <desc id="description">Coding agents, developers, and continuous integration use the same policy. A repository supplies its code, project details, locked Code Polishy release, and agent workflow. Code Polishy applies its policy to the repository and current change, checks architecture, code quality, tests and builds, and dependency risk, then returns findings or marks the change ready to merge after the final gate passes.</desc>

  <defs>
    <pattern id="paper-grid" width="6" height="6" patternUnits="userSpaceOnUse">
      <path d="M .5 0 V 6 M 0 .5 H 6" fill="none" stroke="#031425" stroke-opacity=".018" />
    </pattern>
    <marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#031425" />
    </marker>
    <style>
      .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
      .display { font-family: Didot, "Bodoni 72", "Bodoni MT", "Times New Roman", serif; font-weight: 500; }
      .hero-title { font-size: 52px; letter-spacing: -1.2px; }
      .major-title { font-size: 32px; font-weight: 750; letter-spacing: -.5px; }
      .section-title { font-size: 24px; font-weight: 750; letter-spacing: .2px; }
      .body { font-size: 18px; font-weight: 450; }
      .body-strong { font-size: 18px; font-weight: 650; }
      .eyebrow { font-size: 14px; font-weight: 750; letter-spacing: 1.8px; }
      .ink { fill: #031425; }
      .soft { fill: #203346; }
      .cream { fill: #fdf2e0; }
      .flow { fill: none; stroke: #031425; stroke-width: 2; }
    </style>
  </defs>

  <rect width="1200" height="900" fill="#fdf2e0" />
  <rect width="1200" height="900" fill="url(#paper-grid)" />

  <!-- Heading -->
  <g aria-hidden="true" stroke="#031425" stroke-width="1.5">
    <path d="M 65 67 H 101 M 83 49 V 85" />
    <rect x="76" y="60" width="14" height="14" fill="none" />
    <rect x="80" y="64" width="6" height="6" fill="none" />
  </g>
  <text x="600" y="61" class="mono eyebrow" fill="#30669d" text-anchor="middle">HOW IT WORKS</text>
  <text x="600" y="108" class="display hero-title ink" text-anchor="middle">One policy from change to merge.</text>
  <path d="M 120 137 H 1080" fill="none" stroke="#031425" stroke-opacity=".45" stroke-width="2" stroke-dasharray="2 7" />

  <!-- Who runs it -->
  <text x="390" y="181" class="mono section-title ink">Coding agent · Developer · CI</text>
  <text x="600" y="210" class="mono body soft" text-anchor="middle">use the same policy</text>
  <path d="M 600 224 V 264" class="flow" marker-end="url(#arrow-ink)" />

  <!-- Repository -->
  <rect x="156" y="276" width="900" height="96" fill="#031425" opacity=".22" />
  <rect x="150" y="270" width="900" height="96" fill="#010c1b" />
  <text x="180" y="310" class="mono major-title cream">Your repository</text>
  <text x="180" y="342" class="mono body" fill="#dbe4ec">Code · project details · locked release · agent workflow</text>

  <path d="M 600 367 V 407" class="flow" marker-end="url(#arrow-ink)" />

  <!-- Code Polishy -->
  <rect x="126" y="420" width="960" height="132" fill="#031425" opacity=".22" />
  <rect x="120" y="414" width="960" height="132" fill="#133f8e" />
  <rect x="120" y="414" width="9" height="132" fill="#568dc7" />
  <text x="158" y="459" class="mono major-title cream">Code Polishy</text>
  <text x="158" y="495" class="mono body-strong" fill="#fdf2e0">Applies its policy to your repo and current change.</text>
  <text x="158" y="525" class="mono body" fill="#cbd8e5">Selects checks · keeps results consistent · runs repo commands</text>

  <path d="M 600 547 V 575" class="flow" marker-end="url(#arrow-ink)" />

  <!-- Checks -->
  <text x="100" y="590" class="mono eyebrow" fill="#30669d">WHAT IT CHECKS</text>
  <rect x="106" y="612" width="1000" height="132" fill="#031425" opacity=".12" />
  <rect x="100" y="606" width="1000" height="132" fill="#f6e5cc" stroke="#031425" stroke-opacity=".42" />

  <g>
    <rect x="132" y="634" width="48" height="5" fill="#568dc7" />
    <text x="132" y="674" class="mono section-title ink">Architecture</text>
    <text x="132" y="709" class="mono body soft">Untangled code</text>
  </g>

  <g>
    <rect x="382" y="634" width="48" height="5" fill="#cabce7" />
    <text x="382" y="674" class="mono section-title ink">Code quality</text>
    <text x="382" y="709" class="mono body soft">Bugs + complexity</text>
  </g>

  <g>
    <rect x="632" y="634" width="48" height="5" fill="#f2b96f" />
    <text x="632" y="674" class="mono section-title ink">Tests + builds</text>
    <text x="632" y="709" class="mono body soft">Required checks</text>
  </g>

  <g>
    <rect x="882" y="634" width="48" height="5" fill="#258030" />
    <text x="882" y="674" class="mono section-title ink">Supply chain</text>
    <text x="882" y="709" class="mono body soft">Dependency risk</text>
  </g>

  <!-- Outcomes -->
  <path d="M 600 739 V 762" class="flow" />
  <circle cx="600" cy="762" r="4" fill="#031425" />
  <path d="M 600 762 H 368 V 780" class="flow" marker-end="url(#arrow-ink)" />
  <path d="M 600 762 H 832 V 780" class="flow" marker-end="url(#arrow-ink)" />

  <rect x="156" y="792" width="438" height="66" fill="#031425" opacity=".14" />
  <rect x="150" y="786" width="438" height="66" fill="#cabce7" stroke="#031425" />
  <text x="178" y="811" class="mono eyebrow" fill="#30669d">FINDINGS</text>
  <text x="178" y="839" class="mono section-title ink">Agent fixes and reruns</text>

  <rect x="618" y="792" width="438" height="66" fill="#031425" opacity=".14" />
  <rect x="612" y="786" width="438" height="66" fill="#258030" stroke="#031425" />
  <text x="640" y="811" class="mono eyebrow cream">FINAL GATE PASSES</text>
  <text x="640" y="839" class="mono section-title cream">Ready to merge</text>
</svg>
